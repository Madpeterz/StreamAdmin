# Brotli for text responses. Cloudflare asks the origin for what the browser accepts, so this covers
# direct and tunnelled requests alike. gzip (already on in the base image) stays as the fallback.
brotli            on;
brotli_comp_level 5;
brotli_types      text/plain text/css text/xml text/javascript application/json application/javascript application/xml application/rss+xml application/atom+xml image/svg+xml;

# Vite writes name.js.br / name.js.gz next to every built asset (docker/precompress.mjs)
brotli_static     on;
gzip_static       on;
