# Cloudflare Tunnel variant: the website is reached through cloudflared on the external "playerdb" network.
# No ports are published to the host (phpMyAdmin is bound to 127.0.0.1 only).
# Settings and secrets come from a .env file next to this file (copy .env.cloudflared.example to .env and fill it in)
# or from the stack environment variables if you deploy with Portainer.
# cloudflared ingress for the hostname should point at: http://SA7Website:80
services:
    SA7Website:
        container_name: SA7Website
        restart: always
        image: madpeter/streamadmin:${STREAMADMIN_TAG:?set STREAMADMIN_TAG to the target version}
        networks:
        - streamadmin
        - playerdb
        depends_on:
        - SA7Db
        - SA7Redis
        environment:
        - SITE_NAME=${SITE_NAME:-Streamadmin}
        - SITE_URL=${SITE_URL:?set SITE_URL to the public tunnel url with a ending /}
        - SITE_CACHE_ENABLED=true
        - SITE_CACHE_REDIS_HOST=SA7Redis
        - SQL_HOST=SA7Db
        - SQL_DB_NAME=streamadmin
        - SQL_DB_USER=streamadminDBuser
        - SQL_DB_PASS=${SQL_DB_PASS:?set SQL_DB_PASS}
        - REDIS_HOST=SA7Redis
        - SESSION_DRIVER=redis
        - CACHE_DRIVER=redis

    SA7Cron:
        container_name: SA7Cron
        restart: always
        image: madpeter/streamadmin:${STREAMADMIN_TAG:?set STREAMADMIN_TAG to the target version}
        entrypoint: /bin/bash
        command: [".docker/CronEntrypoint.sh"]
        networks:
        - streamadmin
        depends_on:
        - SA7Db
        - SA7Redis
        - SA7Website
        environment:
        - SITE_NAME=${SITE_NAME:-Streamadmin}
        - SITE_URL=${SITE_URL:?set SITE_URL to the public tunnel url with a ending /}
        - SITE_CACHE_ENABLED=true
        - SITE_CACHE_REDIS_HOST=SA7Redis
        - SQL_HOST=SA7Db
        - SQL_DB_NAME=streamadmin
        - SQL_DB_USER=streamadminDBuser
        - SQL_DB_PASS=${SQL_DB_PASS:?set SQL_DB_PASS}
        - REDIS_HOST=SA7Redis
        - SESSION_DRIVER=redis
        - CACHE_DRIVER=redis

    SA7Db:
        container_name: SA7Db
        image: mariadb
        restart: always
        networks:
        - streamadmin
        environment:
        - MYSQL_RANDOM_ROOT_PASSWORD=yes
        - MYSQL_ALLOW_EMPTY_PASSWORD=no
        - MYSQL_USER=streamadminDBuser
        - MYSQL_PASSWORD=${SQL_DB_PASS:?set SQL_DB_PASS}
        - MYSQL_DATABASE=streamadmin
        volumes:
        - streamadmin-db:/var/lib/mysql

    SA7PHPmyAdmin:
        container_name: SA7PHPmyAdmin
        environment:
        - PMA_HOST=SA7Db
        - UPLOAD_LIMIT=300M
        networks:
        - streamadmin
        image: 'phpmyadmin/phpmyadmin:latest'
        ports:
        - 127.0.0.1:${PMA_PORT:-8881}:80
        depends_on:
        - SA7Db

    SA7Redis:
        container_name: SA7Redis
        image: redis:4.0-alpine
        networks:
        - streamadmin

networks:
  streamadmin:
  playerdb:
    external: true

volumes:
  streamadmin-db:
