# Contract test stack for the in-world APIs (api.php, hud.php, sys.php, ans.php).
#
#   docker compose -f docker-compose.dev.yml up -d          (once: provides the vendor volume)
#   docker compose -f contract-tests/docker-compose.yml up -d app
#   docker compose -f contract-tests/docker-compose.yml run --rm runner verify
#
# The runner only talks HTTP to TARGET_URL and rebuilds the database before every scenario, from the
# frozen 2.0.1.x schema, then runs the Laravel migrations (RESET_HOOK) exactly like a real upgrade.
name: streamadmin-contract

services:
    db:
        image: mariadb:11.4
        environment:
        - MARIADB_ROOT_PASSWORD=contract
        - MARIADB_DATABASE=streamadmin
        tmpfs:
        - /var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 2s
            timeout: 5s
            retries: 30

    # The application under test, on the contract database. vendor/ comes from the dev stack's volume.
    app:
        image: serversideup/php:8.4-fpm-nginx
        user: root
        volumes:
        - ..:/var/www/html
        - app-vendor:/var/www/html/vendor
        environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - APP_URL=https://streamadmin.contract.test
        - LOG_CHANNEL=stderr
        - DB_CONNECTION=mariadb
        - DB_HOST=db
        - DB_DATABASE=streamadmin
        - DB_USERNAME=root
        - DB_PASSWORD=contract
        - CACHE_STORE=array
        - SESSION_DRIVER=array
        - QUEUE_CONNECTION=sync
        - VIEW_COMPILED_PATH=/tmp/views
        - PHP_OPCACHE_ENABLE=1
        - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
        - SSL_MODE=off
        depends_on:
            db:
                condition: service_healthy

    runner:
        build: runner
        profiles: ["runner"]
        volumes:
        - ..:/srv/website
        - app-vendor:/srv/website/vendor
        working_dir: /srv/website/contract-tests
        entrypoint: ["php", "runner/run.php"]
        environment:
        - TARGET_URL=http://app:8080
        - DB_HOST=db
        - DB_NAME=streamadmin
        - DB_USER=root
        - DB_PASS=contract
        # public URL(s) the target puts in bot commands (normalized to {{site_url}})
        - SITE_URLS=https://streamadmin.contract.test/
        # run after every database rebuild: upgrades the 2.0.1.x schema to 3.0
        - RESET_HOOK=cd /srv/website && DB_HOST=db DB_DATABASE=streamadmin DB_USERNAME=root DB_PASSWORD=contract CACHE_STORE=array APP_ENV=production php artisan migrate --force --no-interaction -q
        depends_on:
            db:
                condition: service_healthy

volumes:
    app-vendor:
        external: true
        name: streamadmin-dev_vendor
