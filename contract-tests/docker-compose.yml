# Contract test stack for the in-world APIs (api.php, hud.php, sys.php, ans.php).
#
#   docker compose -f contract-tests/docker-compose.yml up -d legacy
#   docker compose -f contract-tests/docker-compose.yml run --rm runner verify
#   docker compose -f contract-tests/docker-compose.yml run --rm runner record
#
# The runner only talks HTTP to TARGET_URL and resets the database between scenarios,
# so the same fixtures can later be verified against the Laravel stack.
name: streamadmin-contract

services:
    db:
        image: mariadb:11.4
        environment:
        - MARIADB_ROOT_PASSWORD=contract
        - MARIADB_DATABASE=streamadmin
        tmpfs:
        - /var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 2s
            timeout: 5s
            retries: 30

    legacy:
        image: madpeter/phpapachepreload:php84
        volumes:
        - ../:/srv/website
        - ../.docker/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
        environment:
        - SQL_HOST=db
        - SQL_DB_NAME=streamadmin
        - SQL_DB_USER=root
        - SQL_DB_PASS=contract
        - SITE_URL=https://streamadmin.contract.test/
        depends_on:
            db:
                condition: service_healthy

    # The Laravel port, same database. vendor/ comes from the dev stack's volume
    # (docker compose -f laravel/docker-compose.dev.yml up once first).
    laravel:
        image: serversideup/php:8.4-fpm-nginx
        profiles: ["laravel"]
        user: root
        volumes:
        - ../laravel:/var/www/html
        - laravel-vendor:/var/www/html/vendor
        environment:
        - APP_ENV=production
        - APP_DEBUG=false
        - APP_URL=https://streamadmin.contract.test
        - LOG_CHANNEL=stderr
        - DB_CONNECTION=mariadb
        - DB_HOST=db
        - DB_DATABASE=streamadmin
        - DB_USERNAME=root
        - DB_PASSWORD=contract
        - CACHE_STORE=array
        - SESSION_DRIVER=array
        - QUEUE_CONNECTION=sync
        - VIEW_COMPILED_PATH=/tmp/views
        - PHP_OPCACHE_ENABLE=1
        - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1
        - SSL_MODE=off
        depends_on:
            db:
                condition: service_healthy

    runner:
        image: madpeter/phpapachepreload:php84
        profiles: ["runner"]
        volumes:
        - ../:/srv/website
        # lets RESET_HOOK run the Laravel migrations (see README)
        - laravel-vendor:/srv/website/laravel/vendor
        working_dir: /srv/website/contract-tests
        entrypoint: ["php", "runner/run.php"]
        environment:
        - TARGET_URL=${TARGET_URL:-http://legacy}
        - DB_HOST=db
        - DB_NAME=streamadmin
        - DB_USER=root
        - DB_PASS=contract
        # Public URL(s) the target puts in bot commands (normalized to {{site_url}})
        - SITE_URLS=${SITE_URLS:-https://streamadmin.contract.test/}
        # Optional command run after every database reset (e.g. Laravel migrations on the new stack)
        - RESET_HOOK=${RESET_HOOK:-}
        depends_on:
            db:
                condition: service_healthy

    # Runner for the Laravel target: runs the 2.0.1.x -> 3.0 migrations after every database reset.
    #   docker compose -f contract-tests/docker-compose.yml --profile laravel up -d laravel
    #   docker compose -f contract-tests/docker-compose.yml run --rm runner-laravel verify
    runner-laravel:
        build: runner/laravel
        profiles: ["runner"]
        volumes:
        - ../:/srv/website
        - laravel-vendor:/srv/website/laravel/vendor
        working_dir: /srv/website/contract-tests
        entrypoint: ["php", "runner/run.php"]
        environment:
        - TARGET_URL=http://laravel:8080
        - DB_HOST=db
        - DB_NAME=streamadmin
        - DB_USER=root
        - DB_PASS=contract
        - SITE_URLS=https://streamadmin.contract.test/
        - RESET_HOOK=cd /srv/website/laravel && DB_HOST=db DB_DATABASE=streamadmin DB_USERNAME=root DB_PASSWORD=contract CACHE_STORE=array APP_ENV=production php artisan migrate --force --no-interaction -q
        depends_on:
            db:
                condition: service_healthy

volumes:
    laravel-vendor:
        external: true
        name: streamadmin-dev_vendor
